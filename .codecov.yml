codecov:
  notify:
    # Ordinary, long-only, and threading jobs upload on PRs, pushes, and tags.
    # Scheduled and manual CI runs do not upload an incomplete set.
    after_n_builds: 3
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
    changes:
      default:
        informational: true

comment:
  layout: "header, diff, changes, tree"
  behavior: default
